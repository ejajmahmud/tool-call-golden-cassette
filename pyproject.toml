[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-golden-cassette"
version = "0.1.0"
description = "Records and replays deterministic MCP/HTTP tool interactions as portable JSON cassettes for offline CI testing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
tool-call-golden-cassette = "tool_call_golden_cassette.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_call_golden_cassette*"]
